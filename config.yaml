dataset_name: and_kooopman_example
model: AND
N: 200
seed: 123

# All generator outputs (JLD2 + NPZ) will go here
output_dir: generated_datasets

# Write Python-friendly NPZ alongside the JLD2
python_format: npz   # or "none" to skip

# JLD2 filename inside output_dir
outfile: and_200.jld2

# Optional: sampling ranges per model / parameter
params:
  AND:
    ns:
      dist: linear
      min: 0.1
      max: 1.0
    kappa_ini:
      dist: log10
      min: -0.65
      max: 0.0

    wmaxrep_1:
      dist: log10
      min: 0.0
      max: 3.0
    wmaxrep_2:
      dist: log10
      min: 0.0
      max: 3.0
    wmaxrep_3:
      dist: log10
      min: 0.3
      max: 3.5

    kbrep_1:
      dist: log10
      min: -3.0
      max: -1.0
    kbrep_2:
      dist: log10
      min: -3.0
      max: -1.0
    kbrep_3:
      dist: log10
      min: -3.0
      max: -1.0

    kurep_1:
      dist: log10
      min: -3.0
      max: -1.0
    kurep_2:
      dist: log10
      min: -3.0
      max: -1.0
    kurep_3:
      dist: log10
      min: -3.0
      max: -1.0

    Kq_rep_1:
      dist: log10
      min: 1.7
      max: 4.0
    Kq_rep_2:
      dist: log10
      min: 2.0
      max: 4.2

    nq_rep_1:
      dist: linear
      min: 1.0
      max: 4.0
    nq_rep_2:
      dist: linear
      min: 1.0
      max: 4.0
